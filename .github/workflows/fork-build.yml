name: Fork build

# Fork-only; not part of upstream. Builds the backend and nginx images from this
# fork and pushes them to this fork's GHCR namespace so they can be tested on a
# real deployment before (or instead of) an upstream release.
#
# Tags pushed for every build:
#   sha-<short>      the exact commit
#   <branch-slug>    the branch (e.g. fix-auth), moves with the branch
#   latest           only for builds of main
#
# Images are linux/amd64 only: no QEMU, so builds take minutes, not tens of them.
# Upstream's publish/release/docs workflows are disabled on the fork.
on:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: the selected branch)"
        required: false
        type: string

concurrency:
  group: fork-build-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            file: backend/Dockerfile
          - image: nginx
            context: .
            file: nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Work out image name and tags
        id: t
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ inputs.ref || github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/mikrotik-manager-${IMAGE}"
          sha=$(git rev-parse --short=7 HEAD)
          slug=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's|[^a-z0-9._-]+|-|g; s|^-+||; s|-+$||' | cut -c1-100)
          {
            echo "name=${name}"
            echo "tags<<EOF"
            echo "${name}:sha-${sha}"
            echo "${name}:${slug}"
            if [ "$REF_NAME" = "main" ]; then echo "${name}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build date
        id: d
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.t.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.d.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
